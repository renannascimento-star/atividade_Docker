<form>
  <div class="grid">
    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" [(ngModel)]="registro().nome" required>

    <label for="endereco">Endereço</label>
    <input type="text" name="endereco" id="endereco" [(ngModel)]="registro().endereco">
  </div>

  <input type="button" value="Cancelar" routerLink="/config/unidade-list">
  <input type="button" value="Salvar" (click)="salvar()">
</form>
