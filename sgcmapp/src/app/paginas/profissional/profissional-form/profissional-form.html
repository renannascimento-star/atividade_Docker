<form>
  <div>
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" [(ngModel)]="registro().nome" />
  </div>
  <div>
    <label for="registroConselho">Registro do Conselho</label>
    <input type="text" id="registroConselho" name="registroConselho" [(ngModel)]="registro().registroConselho" />
  </div>
  <div>
    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" name="telefone" [(ngModel)]="registro().telefone" />
  </div>
  <div>
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" [(ngModel)]="registro().email" />
  </div>
  <div>
    <label for="especialidade">Especialidade</label>
    <select id="especialidade" name="especialidade" [(ngModel)]="registro().especialidade" [compareWith]="compararPorId">
      @for (item of especialidades(); track item) {
        <option [ngValue]="item">{{ item.nome }}</option>
      }
    </select>
  </div>
  <div>
    <label for="unidade">Unidade</label>
    <select id="unidade" name="unidade" [(ngModel)]="registro().unidade" [compareWith]="compararPorId">
      @for (item of unidades(); track item) {
        <option [ngValue]="item">{{ item.nome }}</option>
      }
    </select>
  </div>
  <div>
    <input type="button" value="Salvar" (click)="salvar()" />
    <input type="button" value="Cancelar" routerLink="/profissional-list" />
  </div>
</form>
